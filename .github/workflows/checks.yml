name: checks

# Static checks for an addon that cannot be run outside the game client.
# Everything here works with no ESO install, no log file and no secrets, and
# each step is the same script a developer runs locally:
#
#   sh   test/checks/syntax.sh
#   sh   test/checks/encoding.sh
#   luajit test/checks/globals.lua
#   luajit test/checks/manifest.lua
#   luajit test/checks/contracts.lua
#   luajit test/checks/filters.lua
#   luajit test/checks/settings-usage.lua
#   luajit test/checks/state-reset.lua
#
# ESO runs a Lua 5.1 dialect; LuaJIT is source-compatible and is what the
# offline test harness already targets.

on:
  push:
    branches: ["master", "feature/**", "fix/**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends luajit
          luajit -v

      # Every .lua file must compile.  Catches the typos ESO reports only by
      # refusing to load the addon at all.
      - name: Syntax
        run: sh test/checks/syntax.sh

      # No UTF-8 BOMs. Lua tolerates them, so they survive unnoticed and show
      # up as spurious first-line diffs.
      - name: Encoding
        run: sh test/checks/encoding.sh

      # No global writes (they leak into the environment shared with every
      # other installed addon), and no global reads outside the ESO API
      # surface (a missing `local X = require(...)` reads nil and throws at
      # the first line that runs).
      - name: Globals
        run: luajit test/checks/globals.lua

      # incha.txt is the only thing ESO reads to decide what to load: a file
      # that exists but is unlisted never runs, and a listed file that was
      # deleted is skipped silently.
      - name: Manifest
        run: luajit test/checks/manifest.lua

      # Load every Factory and boss class under the offline stubs and assert
      # the lifecycle contract: detectable bosses, resolvable BossBase
      # helpers, and an onDied for any boss that tracks cast bars.
      - name: Contracts
        run: luajit test/checks/contracts.lua

      # Combat and effect events are registered per ability id, so the sets a
      # boss routes and the sets its common module claims must stay disjoint,
      # and every handler must have a set to register from.
      - name: Filters
        run: luajit test/checks/filters.lua

      # Every settings key needs a reader. A checkbox with no reader is worse
      # than dead code because the player can still click it.
      - name: Settings usage
        run: luajit test/checks/settings-usage.lua

      # Per-pull state has to be reset by onWipe: Trial reuses the boss instance
      # across a wipe, so a field nothing touches keeps last pull's value.
      - name: State reset
        run: luajit test/checks/state-reset.lua
